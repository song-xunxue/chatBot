  <ellipse cx="76" cy="110" rx="10" ry="13" fill="#4A3B2A"/>
  <ellipse cx="124" cy="110" rx="10" ry="13" fill="#4A3B2A"/>
  <circle cx="79" cy="105" r="3.2" fill="#FFFFFF"/>
  <circle cx="127" cy="105" r="3.2" fill="#FFFFFF"/>
  <!-- 鼻子 -->
  <path d="M100 132 q9 0 9 7 q0 6 -9 6 q-9 0 -9 -6 q0 -7 9 -7 Z" fill="#4A3B2A"/>
  <!-- 嘴 -->
  <path d="M100 145 q-8 9 -17 3 M100 145 q8 9 17 3" stroke="#4A3B2A" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <!-- 腮红 -->
  <circle cx="58" cy="133" r="9" fill="#FFD9DD" opacity="0.65"/>
  <circle cx="142" cy="133" r="9" fill="#FFD9DD" opacity="0.65"/>
</svg>
