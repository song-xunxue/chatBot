  <ellipse cx="100" cy="118" rx="66" ry="60" fill="#FFFFFF" stroke="#E3CDB0" stroke-width="3"/>
  <!-- 脸颊蓬松 -->
  <circle cx="42" cy="128" r="16" fill="#FFFFFF" stroke="#E3CDB0" stroke-width="3"/>
  <circle cx="158" cy="128" r="16" fill="#FFFFFF" stroke="#E3CDB0" stroke-width="3"/>
