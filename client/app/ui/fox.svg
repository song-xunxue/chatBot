  <path d="M150 75 L166 18 L108 60 Z" fill="#FFFFFF" stroke="#E3CDB0" stroke-width="3" stroke-linejoin="round"/>
  <!-- 内耳（粉） -->
  <path d="M55 66 L46 34 L82 58 Z" fill="#FFC4D0"/>
  <path d="M145 66 L154 34 L118 58 Z" fill="#FFC4D0"/>
