# MyChat V2.0 nginx 反代配置(HTTPS 终结 → V2.0 app)
# 作者: 李文煜
# 日期: 2026-07-01
#
# 部署位置:服务器 /opt/nginx-docker/conf/nginx.conf(nginx-ssl 容器 bind 挂载,ro)
# 前置条件:① nginx-ssl 容器已加入 chatbot_v2_net(docker network connect chatbot_v2_net nginx-ssl)
#          ② mychat-server-v2 容器在 chatbot_v2_net 中(可 DNS 解析)
# 生效:docker exec nginx-ssl nginx -s reload
#
# 说明:原 nginx-ssl 仅服务空静态页(443 半成品);本配置把 443 的 / 全反代到 V2.0 app,
#       覆盖 QQ webhook(/qq/webhook)、健康检查(/health)、REST 面板(/api/*)、Web 面板(/)
# 2026-07-01
# 变更说明：
#   1. M9 部署:443 反代 mychat-server-v2:8000(转发 QQ 签名头 + 原始 body,保验签正确)
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    # QQ webhook 上行体可能略大(JSON 事件);放宽默认 1M 限制避免大消息/附件事件被截断(验签失败)
    client_max_body_size 16m;

    # HTTP 80 → 重定向 HTTPS(QQ 回调须 443)
    server {
        listen 80;
        server_name songqingxun.icu www.songqingxun.icu;
        return 301 https://$host$request_uri;
    }

    # HTTPS 443 → V2.0 app
    server {
        listen 443 ssl;
        server_name songqingxun.icu www.songqingxun.icu;

        ssl_certificate /etc/nginx/ssl/songqingxun.icu_bundle.crt;
        ssl_certificate_key /etc/nginx/ssl/songqingxun.icu.key;

        ssl_session_timeout 5m;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
        ssl_prefer_server_ciphers on;

        # 全量反代到 V2.0 app(webhook/health/REST/面板静态托管 都在 app 内)
        location / {
            proxy_pass http://mychat-server-v2:8000;

            # 转发客户端原始信息(含 QQ 签名头 X-Signature-Ed25519 / X-Signature-Timestamp)
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_request_headers on;

            # body 原样透传(proxy_pass 默认不改 body,QQ 验签需原始 bytes)
            # QQ 要求 3s 内 200 ACK(app 内已旁路 pipeline);给足缓冲防慢启动误杀
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
        }
    }
}
