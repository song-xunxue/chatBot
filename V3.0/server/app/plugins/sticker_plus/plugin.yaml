name: sticker_plus
version: 0.1.0
author: 李文煜
description: "表情包增强——自动配图(按心情档位+描述词重叠+最近使用降权从表情包库挑一张,回复末尾追加 [表情包: 描述] token,最多1张/条);文字表情渲染参数一并在面板暴露(REST/面板调试用)"
entry: plugin.py
display_name: 表情包增强
category: 表情包
default_enabled: false
hooks:
  - { name: on_message_out, priority: 350 }
config_schema:
  attach_prob: { type: number, default: 0.35, min: 0, max: 1, step: 0.05, description: "自动配图触发概率,0=从不配图,1=每条必配" }
  mood_weight_enable: { type: bool, default: true, description: "按当前心情档位过滤候选表情包(档位无命中时回退全库)" }
  mood_keywords: { type: string, default: "", description: "心情档位附加关键词,格式 档位:词,词;档位:词(如 开心:哈哈,雀跃;难过:呜呜;留空仅用档位名匹配)" }
  usage_window: { type: number, default: 10, min: 1, max: 50, step: 1, description: "最近使用降权窗口(条):窗口内刚用过的表情包打分降权,避免连续重发同一张" }
  render_template: { type: string, default: "", description: "文字表情默认底图路径(留空=自动生成纯色底;REST /api/v1/sticker/render 与面板用)" }
  render_font: { type: string, default: "C:/Windows/Fonts/msyh.ttc", description: "文字表情字体路径(渲染用)" }
  render_font_size: { type: number, default: 48, min: 12, max: 200, step: 1, description: "文字表情字号(像素,渲染用)" }
  render_stroke: { type: number, default: 2, min: 0, max: 10, step: 1, description: "文字描边宽度(像素,0=不描边,渲染用)" }
  render_position:
    type: string
    default: bottom
    options:
      - { value: top, label: "顶部" }
      - { value: center, label: "居中" }
      - { value: bottom, label: "底部" }
    description: "文字在底图上的位置(渲染用)"
