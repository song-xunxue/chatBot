name: tts_reply
version: 1.1.0
author: 李文煜
description: 回复转语音发送——GPT-SoVITS 合成 wav 转 silk 发 QQ 语音条;音色/语速/gain/情感/合成参数 面板可配
entry: plugin.py
display_name: 语音回复
category: 回复增强
default_enabled: false
hooks:
  - { name: on_message_out, priority: 300 }
config_schema:
  voice:
    type: string
    default: claire
    options:
      - { value: anna, label: "anna 沉稳" }
      - { value: bella, label: "bella 激情" }
      - { value: claire, label: "claire 温柔" }
      - { value: diana, label: "diana 欢快" }
  speed: { type: number, default: 1.0, min: 0.25, max: 4.0, step: 0.05, description: "语速,1.0=正常" }
  gain: { type: number, default: 0.0, min: -10, max: 10, step: 0.5, description: "增益dB,0=不变" }
  emotion_enable: { type: bool, default: true, description: "LLM通读回复推导情感语气" }
  send_text_also: { type: bool, default: false, description: "发语音时是否同发文本,关=只语音" }
  top_k: { type: number, default: 5, min: 1, max: 50, step: 1, description: "采样候选数,小=保守大=多样" }
  top_p: { type: number, default: 1.0, min: 0.1, max: 1.0, step: 0.05, description: "核采样阈值,1.0=全选" }
  temperature: { type: number, default: 1.0, min: 0.1, max: 2.0, step: 0.05, description: "温度,高=随机多变低=稳定" }
  batch_size: { type: number, default: 4, min: 1, max: 10, step: 1, description: "批量推理,大=快但吃显存" }
  repetition_penalty: { type: number, default: 1.35, min: 1.0, max: 2.0, step: 0.05, description: "重复惩罚,防卡顿重复" }
